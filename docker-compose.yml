version: '3.8'

services:
  # ===== MySQL Database =====
  mysql:
    image: mysql:8.0
    container_name: control-silc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: control_silc
      MYSQL_USER: control_silc
      MYSQL_PASSWORD: control_silc_pass
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    networks:
      - control-silc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== PHPMyAdmin =====
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: control-silc-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - control-silc-network
    restart: unless-stopped

  # ===== Backend FastAPI =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: control-silc-backend
    environment:
      DEBUG: "true"
      DATABASE_URL: "mysql+pymysql://control_silc:control_silc_pass@mysql:3306/control_silc"
      SECRET_KEY: "your-secret-key-change-in-production"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://127.0.0.1:3000", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - control-silc-network
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # ===== Frontend React =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: control-silc-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - control-silc-network
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: "http://localhost:8000/api/v1"

  # ===== Nginx Proxy Reverso =====
  nginx:
    image: nginx:alpine
    container_name: control-silc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - control-silc-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  control-silc-network:
    driver: bridge
